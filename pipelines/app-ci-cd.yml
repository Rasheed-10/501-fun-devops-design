name: App CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "pipelines/app-ci-cd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CONTAINER_REGISTRY: acr501fun.azurecr.io
  IMAGE_NAME: backend-api

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          echo "Run application unit tests here"

      - name: Build container image
        run: |
          docker build -t $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }} .

      - name: Scan container image
        run: |
          echo "Run Trivy or similar image scan here"

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to Azure Container Registry
        run: |
          az acr login --name acr501fun
          docker push $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ca-backend-api-dev \
            --resource-group rg-501fun-dev \
            --image $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }}